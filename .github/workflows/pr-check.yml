name: Mobile PR Check & Quality

on:
  pull_request:
    branches:
      - main
      - desenv
  push:
    branches:
      - main
      - desenv

jobs:
  analyze-test-and-sonar:
    name: Flutter Analyze, Test & SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Lint & Static Analysis
        run: flutter analyze

      - name: Run Unit Tests with Coverage
        run: flutter test --coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
