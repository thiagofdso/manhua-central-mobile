name: Mobile PR Check & CI

on:
  pull_request:
    branches:
      - main
      - desenv
  push:
    branches:
      - main
      - desenv

jobs:
  analyze-and-test:
    name: Flutter Analyze & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Lint & Static Analysis
        run: flutter analyze

      - name: Run Unit Tests with Coverage
        run: flutter test --coverage
